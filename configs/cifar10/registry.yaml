experiments:
  - name: cifar10-resnet20-sweep
    kind: sweep
    family: cifar10
    config: configs/cifar10/resnet20_sweep.yaml
    description: ResNet-20 centralized CIFAR-10 threshold sweep.
  - name: cifar10-resnet18-sweep
    kind: sweep
    family: cifar10
    config: configs/cifar10/resnet18_sweep.yaml
    description: ResNet-18 centralized CIFAR-10 threshold sweep.
  - name: cifar10-vgg16-sweep
    kind: sweep
    family: cifar10
    config: configs/cifar10/vgg16_sweep.yaml
    description: VGG-16 centralized CIFAR-10 threshold sweep.
  - name: cifar100-vgg16-sweep
    kind: sweep
    family: cifar100
    config: configs/cifar100/vgg16_sweep.yaml
    description: VGG-16 centralized CIFAR-100 threshold sweep.
  - name: cifar10-all-models-sweep
    kind: sweep
    family: cifar10
    config: configs/cifar10/all_models_sweep.yaml
    description: Combined centralized CIFAR-10 threshold sweep across all tracked models.
  - name: cifar10-resnet20-report
    kind: report
    family: cifar10
    config: configs/cifar10/report_resnet20.yaml
    description: Collect and plot centralized CIFAR-10 reports for the ResNet-20 sweep outputs.
  - name: cifar10-all-models-report
    kind: report
    family: cifar10
    config: configs/cifar10/report_all_models.yaml
    description: Collect and plot centralized CIFAR-10 reports across all tracked models.
  - name: cifar100-vgg16-report
    kind: report
    family: cifar100
    config: configs/cifar100/report_vgg16.yaml
    description: Collect and plot centralized CIFAR-100 reports for the VGG-16 sweep outputs.
  - name: wikitext2-lstm-sweep
    kind: sweep
    family: wikitext2
    config: configs/wikitext2/lstm_sweep.yaml
    description: 2-layer LSTM word-level WikiText-2 language-modeling sweep.
  - name: wikitext2-lstm-report
    kind: report
    family: wikitext2
    config: configs/wikitext2/report_lstm.yaml
    description: Collect and plot centralized WikiText-2 LSTM sweep outputs.
  - name: wikitext2-lstm-bptt70-sweep
    kind: sweep
    family: wikitext2
    config: configs/wikitext2/lstm_bptt70_sweep.yaml
    description: 2-layer LSTM WikiText-2 sweep with BPTT 70 and learning rates 30, 40, and 50.
  - name: wikitext2-lstm-bptt70-report
    kind: report
    family: wikitext2
    config: configs/wikitext2/report_lstm_bptt70.yaml
    description: Collect and plot the isolated WikiText-2 LSTM BPTT-70 sweep outputs.
  - name: llm-fake-tiny-adamw-sweep
    kind: sweep
    family: llm_finetune
    config: configs/llm_finetune/fake_tiny_adamw_sweep.yaml
    description: Local smoke sweep for causal language-model fine-tuning with AdamW.
  - name: rte-albert-base-v2-adamw-sweep
    kind: sweep
    family: llm_finetune
    config: configs/llm_finetune/albert_base_v2_rte_adamw_sweep.yaml
    description: ALBERT-base-v2 fine-tuning sweep on GLUE RTE with AdamW.
