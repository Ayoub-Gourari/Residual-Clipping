models:
  - resnet18
dataset: cifar10
epochs: 200
batch_size: 128
test_batch_size: 256
loader_workers: 4
lrs:
  - 0.05
  - 0.1
beta: 0.9
weight_decay: 0.0005
clip_values:
  - 0.1
  - 0.3
  - 1.0
  - 3.0
res_clip_values:
  - 0.03
  - 0.1
  - 0.3
  - 1.0
lr_milestones: 100,150
lr_gamma: 0.1
log_interval: 100
data_dir: datasets
output_dir: outputs/cifar10
download: false
wandb_mode: disabled
